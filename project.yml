name: MyApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Một nguồn duy nhất cho version: Info.plist chỉ tham chiếu $(MARKETING_VERSION)
    # và $(CURRENT_PROJECT_VERSION). fastlane KHÔNG tự tăng — sửa ở đây rồi commit,
    # để số trên TestFlight luôn truy ngược được về một commit.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sendable mistakes become build errors instead of crashes under load.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  KVRouter:
    url: https://github.com/khanhVu-ops/KVRouter.git
    from: 3.2.1
  KVDIKit:
    url: https://github.com/khanhVu-ops/KVDIKit.git
    from: 1.0.0
  KVNetworkit:
    url: https://github.com/khanhVu-ops/KVNetworkit.git
    from: 2.0.0
  KVToastKit:
    url: https://github.com/khanhVu-ops/KVToastKit.git
    from: 1.0.0
  KVLoggingKit:
    url: https://github.com/khanhVu-ops/KVLoggingKit.git
    from: 1.0.0

targets:
  MyApp:
    type: application
    platform: iOS
    # One target, layered by folder. The order here is the dependency direction
    # the code is meant to follow — Core outward to Features — and
    # tools/check-arch.sh is what actually enforces it, since a single module has
    # no import statements between its own files to lean on.
    sources:
      - path: Core
      - path: Domain
      - path: Data
      - path: DI
      - path: DesignSystem
      - path: Features
      - path: App
    dependencies:
      - package: KVRouter
        product: KVRouterKit
      - package: KVRouter
        product: KVRouterCore
      - package: KVDIKit
        product: KVDIKit
      - package: KVNetworkit
        product: KVNetworkit
      - package: KVToastKit
        product: KVToastKit
      - package: KVLoggingKit
        product: KVLoggingKit
      - package: KVLoggingKit
        product: KVLoggingSwiftUI
      - package: KVLoggingKit
        product: KVLoggingLocal
      - package: KVLoggingKit
        product: KVLoggingSecurity
      - package: KVLoggingKit
        product: KVLoggingNetwork
      - package: KVLoggingKit
        product: KVLoggingConsole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Required for `@testable import MyApp`. Debug only — testability
        # disables some optimisations and should not ship.
        ENABLE_TESTABILITY: "YES"
      configs:
        Debug:
          API_BASE_URL: https://api-dev.example.com
          ENVIRONMENT_NAME: debug
          # Fixtures instead of the network, so the template runs out of the box.
          # Set NO as soon as API_BASE_URL points at something real.
          USES_STUB_BACKEND: "YES"
        Staging:
          API_BASE_URL: https://api-staging.example.com
          ENVIRONMENT_NAME: staging
          ENABLE_TESTABILITY: "NO"
          USES_STUB_BACKEND: "NO"
        Release:
          API_BASE_URL: https://api.example.com
          ENVIRONMENT_NAME: production
          ENABLE_TESTABILITY: "NO"
          USES_STUB_BACKEND: "NO"

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MyApp
      - package: KVRouter
        product: KVRouterTesting
      - package: KVNetworkit
        product: KVNetworkit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
        MyAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MyAppTests
  MyApp-Staging:
    build:
      targets:
        MyApp: all
    run:
      config: Staging
  MyApp-Release:
    build:
      targets:
        MyApp: all
    run:
      config: Release
